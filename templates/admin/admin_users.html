{% extends "base.html" %}

<!-- Скрипт страницы -->
{% block script %}
<script src="{{ url_for('static', path='js/admin/admin_users.js')}}"></script>
{% endblock %}

<!-- Разметка -->
{% block body %}
<main class="main-container">
  <a href="{{ url_for('admin_pg') }}" class="return-btn flat-button">
    <i data-lucide="chevron-left"></i>
    На главную
  </a>
  <h2 class="section-header">Управление пользователями</h2>
  <p class="section-description">
    Здесь можно добавить или удалить аккаунт любого пользователя,<br />
    а также выдать или отозвать у него права администратора.
  </p>

  <div class="upload-region">
    <button type="button" class="button">
      <i data-lucide="user-round-plus"></i>
      Зарегистрировать
    </button>
  </div>

  <div class="presentations-search">
    <i data-lucide="search" class="icon"></i>
    <input
      type="search"
      id="searchbar"
      class="searchbar input"
      placeholder="Поиск"
    />
  </div>
  <div class="result-stats" id="found-result"></div>
  <div class="table-wrapper" id="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th class="th-login" scope="col">Логин</th>
          <th scope="col">Уровень доступа</th>
          <th class="th-actions" scope="col">Действия</th>
        </tr>
      </thead>
      <tbody id="presentations-table"></tbody>
    </table>
  </div>
</main>
{% endblock %}
